<style>
:root{
  --sage:#bdb69d; --sage-d:#9a967f; --sage-l:#d9d4c3;
  --bg:#f3f0e8; --surface:#fbfaf6; --ink:#1c1b18; --muted:#6d6957; --line:#e2ddcf;
  --btn:#1c1b18; --btn-ink:#f3f0e8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191815; --surface:#22211d; --ink:#ece8dc; --muted:#aaa58f; --line:#34322b;
    --btn:#bdb69d; --btn-ink:#1c1b18; --sage-l:#2c2b25;
  }
}
:root[data-theme="dark"]{
  --bg:#191815; --surface:#22211d; --ink:#ece8dc; --muted:#aaa58f; --line:#34322b;
  --btn:#bdb69d; --btn-ink:#1c1b18; --sage-l:#2c2b25;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.caps{font-family:"Tenor Sans",Inter,sans-serif;text-transform:uppercase;letter-spacing:.18em}

/* hero: mismo fondo que el logo, así se funde */
.hero{background:var(--sage);color:#1c1b18;text-align:center}
.hero .wrap{padding-top:40px;padding-bottom:44px}
.hero .logo{display:block;width:min(520px,92%);height:auto;margin:0 auto}
.hero h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero p{max-width:520px;margin:8px auto 0;color:#3b392f;font-size:16px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;text-decoration:none;font:14px/1 "Tenor Sans",Inter,sans-serif;text-transform:uppercase;letter-spacing:.14em;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:17px;height:17px}
.hero .btn.primary{background:#1c1b18;color:#f3f0e8}
.hero .btn.ghost{border:1px solid #1c1b18;color:#1c1b18}

.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;height:200px}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,1fr);height:280px}}

/* nav */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:10px;padding-top:12px;padding-bottom:10px}
.search{position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--sage-d);outline-offset:1px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.cats{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font:12px/1 "Tenor Sans",Inter,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);background:var(--surface);white-space:nowrap}
.cats a.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}

/* carta */
main{padding:32px 0 40px}
section{margin-bottom:48px}
section h2{font:400 24px/1.2 "Tenor Sans",Inter,sans-serif;text-transform:uppercase;letter-spacing:.16em;margin:0 0 6px;display:flex;align-items:center;gap:14px}
section h2::after{content:"";flex:1;height:1px;background:var(--line)}
section .sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:flex-start}
.item .body{flex:1;min-width:0;padding-top:2px}
.ph{flex:none;width:96px;height:96px;border-radius:10px;object-fit:cover;background:var(--sage-l);cursor:zoom-in}
.ph.noimg{cursor:default;background:var(--sage);display:grid;place-items:center;font:52px/1 "Pinyon Script",cursive;color:var(--sage-d);user-select:none}
.ph.noimg span{transform:translate(2px,6px)}
.tablas .item{flex-direction:column}.tablas .item .ph{width:100%;height:220px}
.row{display:flex;align-items:baseline;gap:10px}
.row h3{margin:0;font-size:16px;font-weight:600}
.row .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:12px}
.price{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.item p{margin:6px 0 0;color:var(--muted);font-size:14px}
.item .opt{font-size:13px;margin-top:8px;color:var(--sage-d)}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sizes span{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-variant-numeric:tabular-nums}
.sizes b{color:var(--muted);font-weight:500;margin-right:4px}
.tablas .grid{grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr))}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
.lb{position:fixed;inset:0;z-index:50;background:rgba(20,19,16,.9);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:85vh;border-radius:12px}

footer{background:var(--sage);color:#1c1b18;text-align:center;padding:40px 16px}
footer .logo{width:min(300px,70%);height:auto}
footer .btn.primary{background:#1c1b18;color:#f3f0e8}
footer .btn.ghost{border:1px solid #1c1b18}
footer small{display:block;margin-top:22px;color:#4a4739;font-size:12px}
.item{min-width:0}.row h3{min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){.tablas .grid,.grid{grid-template-columns:minmax(0,1fr)}.ph{width:84px;height:84px}}
</style>
</head>

s, tomates cherry, frutos secos, dip, cerezas al maraschino y pan.", "sizes": [[1, 28000], [2, 43500], [3, 57000], [4, 75000]], "img": "img/55102.jpg"}, {"c": "platos", "n": "Tortilla papa", "p": 17000, "d": "Tortilla de papa, incluye ensalada mixta y lactonesa.", "img": "img/55794.jpg"}, {"c": "sandwiches", "n": "Tostado de jamon crudo y queso", "p": 18800, "d": "Pan de molde con manteca, jamon crudo, queso tybo y papitas copetin.", "img": "img/55437.jpg"}, {"c": "sandwiches", "n": "Tostado jamon y queso", "p": 16000, "d": "Pan de molde con manteca, jamon cocido natural, queso tybo y papitas copetin.", "img": "img/58527.jpg"}, {"c": "desayunos", "n": "Toston palta y huevo (solo)", "p": 12000, "d": "Tostada de pan de campo, queso crema, huevo revuelto, palta y tomates cherry.", "img": "img/55440.jpg"}, {"c": "tragos", "n": "Vermut lunfa trago", "p": 8500, "d": "Vermut Lunfa, soda, rodajas de limón o naranja."}, {"c": "wraps", "n": "Wrap de parma", "p": 21000, "d": "Tortilla de trigo ahumada, lactonesa cítrica, queso tybo, jamón crudo, rúcula, tomate, nachos, pote de lactonesa de rúcula.", "img": "img/53902.jpg"}, {"c": "wraps", "n": "Wrap de pollo", "p": 19000, "d": "Tortilla de trigo ahumada, lactonesa cítrica, queso tybo, pollo a la mostaza ahumado, rúcula, tomate, nachos, pote de lactonesa de rúcula.", "img": "img/53901.jpg"}, {"c": "wraps", "n": "Wrap jamoncito", "p": 16000, "d": "Tortilla de trigo, lactonesa cítrica, queso tybo, jamón natural, lechuga, tomate, nachos, pote de lactonesa de rúcula.", "img": "img/53903.jpg"}, {"c": "wraps", "n": "Wrap lomazo", "p": 17000, "d": "Tortilla de trigo, lactonesa cítrica, queso tybo, lomito ahumado, lechuga, tomate, nachos, pote de lactonesa de rúcula.", "img": "img/53904.jpg"}, {"c": "wraps", "n": "Wrap veggie", "p": 16000, "d": "Tortilla de trigo y espinaca, lactonesa cítrica, queso tybo, huevo revuelvo, palta, tomate, rúcula, nachos, pote de lactonesa de rúcula.", "img": "img/53900.jpg"}, {"c": "desayunos", "n": "Yogurt+granola+fruta", "p": 10000, "d": "Yogurt + frutas de estación + granola", "img": "img/56262.jpg"}];
const CATS = [
  ["desayunos","Desayunos","Con infusión a elección."],
  ["cafe","Cafetería",""],
  ["dulces","Pastelería",""],
  ["tablas","Tablas","Para 1, 2, 3 o 4 personas."],
  ["sandwiches","Sandwiches","Sandwiches, croissants y tostados, todos con papitas copetín."],
  ["wraps","Wraps","Con nachos y pote de lactonesa de rúcula."],
  ["platos","Platos",""],
  ["licuados","Licuados","Licuados y limonadas."],
  ["bebidas","Bebidas",""],
  ["tragos","Tragos","Tragos y cervezas."]
];
const fmt = n => "$" + n.toLocaleString("es-AR");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const card = it => {
  const price = it.sizes ? "desde " + fmt(Math.min(...it.sizes.map(s=>s[1]))) : (it.p ? fmt(it.p) : "");
  const sizes = it.sizes ? `<div class="sizes">${it.sizes.map(([p,v])=>`<span><b>p/${p}</b>${fmt(v)}</span>`).join("")}</div>` : "";
  const ph = it.img ? `<img class="ph" src="${it.img}" alt="${esc(it.n)}" loading="lazy" width="96" height="96">`
                    : `<div class="ph noimg" aria-hidden="true"><span>T</span></div>`;
  return `<article class="item" data-k="${esc((it.n+" "+it.d).toLowerCase())}">${ph}<div class="body">
    <div class="row"><h3>${esc(it.n)}</h3><span class="dots"></span><span class="price">${price}</span></div>
    ${it.d ? `<p>${esc(it.d)}</p>` : ""}${it.opt ? `<p class="opt">${esc(it.opt)}</p>` : ""}${sizes}
  </div></article>`;
};
document.getElementById("menu").innerHTML = CATS.map(([id,t,sub]) => {
  const its = MENU.filter(m => m.c === id);
  return its.length ? `<section id="${id}" class="${id}"><h2>${t}</h2>${sub?`<p class="sub">${sub}</p>`:""}<div class="grid">${its.map(card).join("")}</div></section>` : "";
}).join("");
document.getElementById("cats").innerHTML = CATS.map(([id,t]) => `<a href="#${id}" data-id="${id}">${t}</a>`).join("");

const lb = document.createElement("div"); lb.className = "lb"; lb.innerHTML = '<img alt="">'; document.body.append(lb);
lb.onclick = () => lb.classList.remove("on");
document.addEventListener("click", e => { if (e.target.matches("img.ph")) { lb.firstChild.src = e.target.src; lb.firstChild.alt = e.target.alt; lb.classList.add("on"); } });
document.addEventListener("keydown", e => e.key === "Escape" && lb.classList.remove("on"));

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
document.getElementById("q").addEventListener("input", e => {
  const q = norm(e.target.value.trim()); let any = false;
  document.querySelectorAll("section").forEach(sec => {
    let vis = 0;
    sec.querySelectorAll(".item").forEach(el => { const ok = !q || norm(el.dataset.k).includes(q); el.style.display = ok ? "" : "none"; vis += ok; });
    sec.style.display = vis ? "" : "none"; any ||= vis > 0;
  });
  document.getElementById("empty").style.display = any ? "none" : "block";
});

const links = [...document.querySelectorAll(".cats a")];
const catsBar = document.getElementById("cats");
// mover SOLO la barra de categorías (scrollIntoView movía también la página y cortaba el scroll al tocar una categoría)
const centerChip = a => catsBar.scrollTo({left: a.offsetLeft - (catsBar.clientWidth - a.offsetWidth) / 2, behavior: "smooth"});
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  links.forEach(a => { const on = a.dataset.id === e.target.id; a.classList.toggle("on", on); if (on) centerChip(a); });
}), {rootMargin:"-130px 0px -65% 0px"});
document.querySelectorAll("section").forEach(s => obs.observe(s));
// la carta se dibuja por JS: si se entra con #seccion, saltar ahí una vez que existe
const goHash = () => { const el = location.hash && document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView({behavior:"instant"}); };
goHash(); window.addEventListener("load", goHash, {once:true});
</script>
